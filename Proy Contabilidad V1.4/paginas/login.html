<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Contable - Iniciar Sesión</title>
    <link rel="stylesheet" href="../estilos/propuesta4.css">
    <style>
        .split-layout {
            display: grid;
            grid-template-columns: 1fr;
            min-height: 100vh;
        }
        .side-form {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: white;
        }
        .side-visual {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: none;
            color: white;
            padding: 60px;
            flex-direction: column;
            justify-content: center;
        }
        .form-contenedor {
            width: 100%;
            max-width: 400px;
        }
        @media (min-width: 768px) {
            .split-layout { grid-template-columns: 1fr 1fr; }
            .side-visual { display: flex; }
        }
    </style>
</head>
<body>
    <div class="split-layout">
        <div class="side-form">
            <div class="form-contenedor">
                <h2 style="font-size: 28px; font-weight: 800; margin-bottom: 8px;">Te damos la bienvenida</h2>
                <p style="margin-bottom: 32px;">Ingresa tus credenciales para acceder al panel.</p>
                
                <div class="grupo" style="margin-bottom: 16px;">
                    <label>Correo Electrónico</label>
                    <input type="email" placeholder="nombre@empresa.com">
                </div>
                <div class="grupo" style="margin-bottom: 24px;">
                    <label>Contraseña</label>
                    <input type="password" placeholder="••••••••">
                </div>
                
                <a href="../index.html" class="boton boton-primario" style="display: block; text-align: center; text-decoration: none; margin-bottom: 16px;">Iniciar Sesión</a>
                <p style="font-size: 14px; text-align: center;">¿No tienes una cuenta? <a href="registro.html" style="color: #3b82f6; text-decoration: none; font-weight: 600;">Regístrate aquí</a></p>
            </div>
        </div>
        <div class="side-visual">
            <h1 style="font-size: 42px; font-weight: 800; color: #3b82f6; margin-bottom: 16px;">FintechSaaS</h1>
            <p style="font-size: 18px; color: #94a3b8; line-height: 1.6;">La suite de auditoría y gestión contable automatizada que transforma balances complejos en reportes interactivos y limpios.</p>
        </div>
    </div>
</body>
</html>
